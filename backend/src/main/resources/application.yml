spring:
  application:
    name: jobtrack
  # Local secrets live in a git-ignored .env file (see .env.example). Real environment
  # variables always take precedence over values from the file.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the mappings match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

jobtrack:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
    issuer: jobtrack
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Local AI model served by Ollama (https://ollama.com). Free, runs on this machine.
  ai:
    ollama-url: ${OLLAMA_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen3:4b-instruct-2507-q4_K_M}
    timeout: ${OLLAMA_TIMEOUT:PT3M}
  # Gmail integration (read-only). Leave the client id/secret empty to disable it.
  gmail:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    # Through the Vite dev server's /api proxy, so it works whatever port the backend runs on.
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/api/gmail/oauth/callback}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    initial-sync-days: ${GMAIL_INITIAL_SYNC_DAYS:60}
    max-messages-per-sync: ${GMAIL_MAX_MESSAGES_PER_SYNC:300}
    sync-interval: ${GMAIL_SYNC_INTERVAL:PT30M}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
