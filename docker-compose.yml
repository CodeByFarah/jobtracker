# Local PostgreSQL for development. Credentials come from the git-ignored .env file.
#   docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: jobtrack-postgres
    environment:
      POSTGRES_DB: jobtrack
      POSTGRES_USER: ${DATABASE_USERNAME:?set DATABASE_USERNAME in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - jobtrack-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d jobtrack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jobtrack-pgdata:
