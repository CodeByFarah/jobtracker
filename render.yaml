# Render Blueprint for the JobTrack API (free plan). The frontend is published to GitHub Pages by
# .github/workflows/pages.yml. Values marked "sync: false" are entered in the Render dashboard and
# never stored in this repository.
services:
  - type: web
    name: jobtrack-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      # PostgreSQL (for example a free Neon database). Use the JDBC form:
      # jdbc:postgresql://<host>/<database>?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://codebyfarah.github.io
      - key: FRONTEND_URL
        value: https://codebyfarah.github.io/jobtracker
      # Optional: Gmail tracking. Leave empty to run without it.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # https://<this service>.onrender.com/api/gmail/oauth/callback, also registered in Google Cloud.
      - key: GOOGLE_REDIRECT_URI
        sync: false
