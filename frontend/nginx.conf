server {
    listen 80;
    root /usr/share/nginx/html;

    # The API (including the Gmail sign-in callback) goes to the backend container.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Same-origin from the browser's point of view: drop Origin so the backend's CORS check
        # doesn't reject it (the Vite dev proxy does the same).
        proxy_set_header Origin "";
        # A first Gmail check with the local AI can take a while.
        proxy_read_timeout 600s;
    }

    # Single-page app: unknown paths load index.html and the React router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
