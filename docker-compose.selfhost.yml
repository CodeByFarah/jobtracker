# Run all of JobTrack on your own computer - app, database and AI - with one command.
# Nothing leaves your machine except the Gmail API calls to your own mailbox.
#
#   1. Copy .env.example to .env and fill it in (see README > Self-hosting).
#   2. docker compose -f docker-compose.selfhost.yml up -d --build
#   3. Open http://localhost:5173
#
# The first start downloads the AI model (about 2.5 GB), so give it a few minutes.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobtrack
      POSTGRES_USER: ${DATABASE_USERNAME:?set DATABASE_USERNAME in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    volumes:
      - selfhost-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d jobtrack"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.9
    volumes:
      - selfhost-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    # Have an NVIDIA GPU? Uncomment to make the AI much faster (needs the NVIDIA container toolkit).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-off job: downloads the model into the ollama volume (skipped quickly once it's there).
  ollama-pull:
    image: ollama/ollama:0.40.9
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    env_file: .env
    environment:
      # These override .env so the containers find each other.
      DATABASE_URL: jdbc:postgresql://postgres:5432/jobtrack
      AI_PROVIDER: ollama
      OLLAMA_URL: http://ollama:11434
      AI_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      GOOGLE_REDIRECT_URI: http://localhost:5173/api/gmail/oauth/callback
      SERVER_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  selfhost-pgdata:
  selfhost-ollama:
